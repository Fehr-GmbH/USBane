name: Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Need full history for tags

    - name: Extract version from sdkconfig.defaults
      id: version
      run: |
        VERSION=$(grep 'CONFIG_USBANE_VERSION=' sdkconfig.defaults | cut -d'"' -f2)
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Detected version: $VERSION"

    - name: Check if tag exists
      id: tag_check
      run: |
        if git rev-parse "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
          echo "exists=true" >> $GITHUB_OUTPUT
          echo "Tag v${{ steps.version.outputs.version }} already exists"
        else
          echo "exists=false" >> $GITHUB_OUTPUT
          echo "Tag v${{ steps.version.outputs.version }} does not exist - will create release"
        fi

    - name: Build with ESP-IDF
      uses: espressif/esp-idf-ci-action@v1
      with:
        # ESP-IDF v6.0 split several previously-bundled components (cJSON,
        # usb host stack, etc.) into the component registry.  We declare
        # those in main/idf_component.yml and the IDF component manager
        # fetches them at configure time.  Use the latest v6.0 patch.
        esp_idf_version: v6.0.1
        target: esp32s3
        path: '.'

    - name: Create merged binary
      run: |
        pip install esptool
        # Single-shot flashable image for 4 MiB (and any larger) ESP32-S3.
        # Note the otadata offset is 0xf000 to match the custom partition
        # table in ./partitions.csv.
        python -m esptool --chip esp32s3 merge-bin -o usbane-full.bin \
          --flash-mode dio --flash-size 4MB --flash-freq 80m \
          0x0 build/bootloader/bootloader.bin \
          0x8000 build/partition_table/partition-table.bin \
          0xf000 build/ota_data_initial.bin \
          0x20000 build/usbane.bin
        echo "Created merged binary: usbane-full.bin"
        ls -la usbane-full.bin

    - name: Upload firmware artifact
      uses: actions/upload-artifact@v4
      with:
        name: usbane-firmware-${{ steps.version.outputs.version }}
        path: usbane-full.bin
        retention-days: 30

    - name: Create Release
      if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && steps.tag_check.outputs.exists == 'false'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v${{ steps.version.outputs.version }}
        name: USBane v${{ steps.version.outputs.version }}
        body: |
          ## USBane v${{ steps.version.outputs.version }}
          
          ### Installation
          Flash the single binary at address 0x0:
          ```bash
          esptool.py --chip esp32s3 -b 460800 write_flash 0x0 usbane-full.bin
          ```
          
          ### What's New
          See commit history for changes.
        files: usbane-full.bin
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
